<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/toon.js"></script>
    <script src="assets/lib/cast.js"></script>
    <script src="assets/lib/kit.js"></script>
    <script src="assets/data/words.js"></script>
    <link rel="stylesheet" href="assets/lib/toon.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1f2833; font-family: "Nunito", sans-serif; }
      #ground { position: absolute; inset: 0; background: #1f2833; }
      #logo-r { right: 44px; z-index: 50; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <!-- scenes:begin -->
      <!-- scenes:end -->
      <img id="grain" class="clip tz-grain" src="assets/bg/grain.soft.png" alt="" data-start="0" data-duration="10" data-track-index="7" data-track-kind="graphics" />
      <div id="logo-r" class="clip tz-logo" data-start="0" data-duration="10" data-track-index="9" data-track-kind="graphics">BRAND</div>
      <audio id="mix" class="clip" data-start="0" data-duration="10" data-track-index="0" data-volume="1" src="assets/audio/mix.wav"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
