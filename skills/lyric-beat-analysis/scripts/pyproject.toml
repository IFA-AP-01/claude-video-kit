[project]
name = "mv-analysis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "demucs>=4.0.1",
  # word timestamps for the cross-check: MLX on Apple Silicon, PyTorch elsewhere
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "openai-whisper>=20240930; sys_platform != 'darwin' or platform_machine != 'arm64'",
  # torchaudio 2.9 removed functional.forced_align and the MMS_FA bundle: keep < 2.9
  "torch>=2.5,<2.9",
  "torchaudio>=2.5,<2.9",
  "librosa>=0.10",
  "scipy",
  "numpy<2.3",
  "soundfile",
  "matplotlib",
]
